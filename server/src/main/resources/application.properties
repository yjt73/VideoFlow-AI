server.port=9090

# 数据库
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:13306/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 上传限制
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# MyBatis Plus
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# AI 服务
ai.deepseek.api-key=${AI_API_KEY}
ai.deepseek.base-url=${AI_BASE_URL:https://api.siliconflow.cn/v1}
ai.deepseek.model=${AI_CHAT_MODEL}
ai.deepseek.timeout-seconds=${AI_CHAT_TIMEOUT_SECONDS:300}
ai.embedding.model=${AI_EMBEDDING_MODEL:BAAI/bge-m3}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# S3 兼容对象存储
storage.s3.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.s3.access-key=${MINIO_ACCESS_KEY}
storage.s3.secret-key=${MINIO_SECRET_KEY}
storage.s3.bucket=${MINIO_BUCKET:media}
storage.s3.region=${MINIO_REGION:us-east-1}
storage.s3.allowed-origins=${STORAGE_ALLOWED_ORIGINS:http://localhost:5173}
storage.s3.download-url-ttl=${STORAGE_DOWNLOAD_URL_TTL:10m}
storage.s3.upload-url-ttl=${STORAGE_UPLOAD_URL_TTL:15m}
storage.delete.scan-delay-ms=${STORAGE_DELETE_SCAN_DELAY_MS:60000}
storage.multipart.cleanup-delay-ms=${STORAGE_MULTIPART_CLEANUP_DELAY_MS:3600000}
storage.audit.delay-ms=${STORAGE_AUDIT_DELAY_MS:86400000}
storage.audit.batch-size=${STORAGE_AUDIT_BATCH_SIZE:500}

# 本地工具
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
tool.ffmpeg.dir=${FFMPEG_DIR:}
tool.ocr.command=${OCR_COMMAND:tesseract}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=video-analysis-group
rocketmq.producer.send-message-timeout=3000

# 分析任务 Outbox
analysis.outbox.publish-delay-ms=${ANALYSIS_OUTBOX_PUBLISH_DELAY_MS:1000}
analysis.outbox.batch-size=${ANALYSIS_OUTBOX_BATCH_SIZE:50}
analysis.outbox.retention-days=${ANALYSIS_OUTBOX_RETENTION_DAYS:7}
analysis.outbox.cleanup-delay-ms=${ANALYSIS_OUTBOX_CLEANUP_DELAY_MS:86400000}
analysis.compensation.scan-delay-ms=${ANALYSIS_COMPENSATION_SCAN_DELAY_MS:60000}
analysis.compensation.stale-after-minutes=${ANALYSIS_COMPENSATION_STALE_AFTER_MINUTES:30}
analysis.compensation.max-attempts=${ANALYSIS_COMPENSATION_MAX_ATTEMPTS:3}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
