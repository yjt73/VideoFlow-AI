# Local development: Docker runs middleware; IDEA and Vite run on the host.
# Use together with compose.yaml, not on its own.
services:
  videoflow-ai:
    profiles: [container]

  mysql:
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"

  rmqnamesrv:
    ports:
      - "127.0.0.1:${ROCKETMQ_NAMESRV_PORT:-9876}:9876"

  rmqbroker:
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro

  rmq-topics:
    # The local Broker advertises 127.0.0.1. Share its network so mqadmin
    # can reach that same address when it creates topics.
    network_mode: service:rmqbroker
