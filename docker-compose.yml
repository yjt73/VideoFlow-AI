name: videoflow-ai

services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: media_db
      MYSQL_USER: ${MYSQL_APP_USER:-videoflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:latest
    ports:
      - "127.0.0.1:16379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:16333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  rmqnamesrv:
    image: apache/rocketmq:5.3.2
    ports:
      - "127.0.0.1:19876:9876"
    environment:
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv

  rmqinit:
    image: apache/rocketmq:5.3.2
    user: "0:0"
    volumes:
      - rocketmq_store:/home/rocketmq/store
      - rocketmq_logs:/home/rocketmq/logs
    entrypoint: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/logs"]

  rmqbroker:
    image: apache/rocketmq:5.3.2
    ports:
      - "127.0.0.1:20911:20911"
      - "127.0.0.1:20909:20909"
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq_store:/home/rocketmq/store
      - rocketmq_logs:/home/rocketmq/logs
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/broker.conf
    depends_on:
      rmqnamesrv:
        condition: service_started
      rmqinit:
        condition: service_completed_successfully

  rmqdashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    profiles: [tools]
    ports:
      - "127.0.0.1:18180:8080"
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=rmqnamesrv:9876
    depends_on:
      - rmqnamesrv

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  minio_data:
  rocketmq_store:
  rocketmq_logs:
